name: Motor Francotirador Bitvavo 24/7

on:
  schedule:
    # Se ejecuta 3 veces por hora (cada 20 min: min 1, 21 y 41)
    # 72 veces al día x 28-30 días = ~1.980 minutos/mes (Apura el límite gratis de 2.000 min al máximo)
    - cron: '1,21,41 * * * *'
  workflow_dispatch:

jobs:
  operar:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el codigo del bot
        uses: actions/checkout@v4

      - name: 2. Encender Python 3.11 con Memoria Cache Ultrarrapida
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar conexion a Bitvavo y motor matematico
        run: pip install ccxt pandas

      - name: 4. Doble Escaneo en 1 Minuto (Aprovecha el minuto entero facturado)
        env:
          BITVAVO_API_KEY: ${{ secrets.BITVAVO_API_KEY }}
          BITVAVO_SECRET_KEY: ${{ secrets.BITVAVO_SECRET_KEY }}
        run: |
          python bot.py
          sleep 30
          python bot.py
