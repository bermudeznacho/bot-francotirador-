name: Motor Francotirador Bitvavo 24/7

on:
  workflow_dispatch: # Permite que cron-job.org pulse el botón automáticamente

jobs:
  operar:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el codigo del bot
        uses: actions/checkout@v4

      - name: 2. Encender Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar conexion a Bitvavo y motor matematico
        run: pip install ccxt pandas

      - name: 4. Doble Escaneo en 1 Minuto
        env:
          BITVAVO_API_KEY: ${{ secrets.BITVAVO_API_KEY }}
          BITVAVO_SECRET_KEY: ${{ secrets.BITVAVO_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u bot.py
          
